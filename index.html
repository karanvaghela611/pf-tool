<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF TOOL - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1456a0;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1456a0;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1456a0;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d4380;
        }

        #error {
            color: red;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">PF TOOL</div>

    <div class="subtitle">
        ECR Text File Generator
    </div>

    <input
        type="text"
        id="clientID"
        placeholder="Client ID"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        LOGIN
    </button>

    <div id="error"></div>

</div>


<script>

function login() {

    const clientID = document.getElementById("clientID").value.trim();
    const password = document.getElementById("password").value;

    /*
       DEMO LOGIN
       Baad me isko real secure database login
       se connect karenge.
    */

    if (clientID === "CLIENT001" && password === "1234") {

        // Login successful
        window.location.href = "dashboard.html";

    } else {

        document.getElementById("error").innerText =
            "Invalid Client ID or Password";

    }
}

</script>

</body>
</html>
